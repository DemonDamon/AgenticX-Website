<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">Near attaches to a local agx serve</title>
  <desc id="desc">Near app spawns agx serve, writes port and token, then calls AgentRuntime.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="540" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="540" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="88" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="start">Boot path</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Near attaches to a local agx serve</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Desktop is not a second runtime. It starts Studio, then talks REST + SSE.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="241" height="136" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H253 Q264.4 108.6 264.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="136" x2="264" y2="136" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Electron</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Near app</text><circle cx="42" cy="174" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">React + Zustand</text><circle cx="42" cy="194" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Hard-binds localhost</text><path d="M267.00 176.00 L272.00 176.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="267.0" cy="176.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M270.50 179.50 L277.00 176.00 L270.50 172.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="279" y="108" width="241" height="136" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M291 108.6 H508 Q519.4 108.6 519.4 120 V136 H279.6 V120 Q279.6 108.6 291 108.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="280" y1="136" x2="519" y2="136" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="291" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="304" y="125.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="323" y="126" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Child process</text><text x="293" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">spawn serve</text><rect x="293" y="166" width="164" height="17" rx="5" fill="color-mix(in oklab, #0ea5e9 8%, var(--muted))" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="0.8"/><text x="299" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">agx serve / agx-server</text><rect x="293" y="186" width="76" height="17" rx="5" fill="color-mix(in oklab, #0ea5e9 8%, var(--muted))" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="0.8"/><text x="299" y="198" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">127.0.0.1</text><path d="M522.00 176.00 L527.00 176.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="522.0" cy="176.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M525.50 179.50 L532.00 176.00 L525.50 172.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="534" y="108" width="241" height="136" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M546 108.6 H763 Q774.4 108.6 774.4 120 V136 H534.6 V120 Q534.6 108.6 546 108.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="535" y1="136" x2="774" y2="136" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><rect x="546" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #8b5cf6 18%, var(--background))" stroke="color-mix(in oklab, #8b5cf6 42%, var(--border))" stroke-width="1"/><text x="559" y="125.5" fill="color-mix(in oklab, #8b5cf6 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">03</text><text x="578" y="126" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Discovery</text><text x="548" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Write port</text><rect x="548" y="166" width="164" height="17" rx="5" fill="color-mix(in oklab, #8b5cf6 8%, var(--muted))" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="0.8"/><text x="554" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">~/.agenticx/serve.port</text><rect x="548" y="186" width="89" height="17" rx="5" fill="color-mix(in oklab, #8b5cf6 8%, var(--muted))" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="0.8"/><text x="554" y="198" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">serve.token</text><path d="M655.0 244.0 L655.0 250.5 Q655.0 256.0 649.5 256.0 L217.5 256.0 Q212.0 256.0 212.0 261.5 L212.0 263.5" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><circle cx="655.0" cy="244.0" r="3" fill="var(--background)" stroke="#0ea5e9" stroke-width="1.6"/><path d="M208.50 261.50 L212.00 268.00 L215.50 261.50 Z" fill="#0ea5e9"/><g filter="url(#card-shadow)"><rect x="24" y="268" width="369" height="126" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M36 268.6 H381 Q392.4 268.6 392.4 280 V296 H24.6 V280 Q24.6 268.6 36 268.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="25" y1="296" x2="392" y2="296" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="273" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="49" y="285.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">04</text><text x="68" y="286" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">HTTP</text><text x="38" y="317" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Studio API</text><circle cx="42" cy="334" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="50" y="338" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">REST + SSE</text><rect x="38" y="346" width="130" height="17" rx="5" fill="color-mix(in oklab, #0ea5e9 8%, var(--muted))" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="0.8"/><text x="44" y="358" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">AGX_DESKTOP_TOKEN</text><path d="M395.00 331.00 L400.00 331.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="395.0" cy="331.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M398.50 334.50 L405.00 331.00 L398.50 327.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="407" y="268" width="369" height="126" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M419 268.6 H764 Q775.4 268.6 775.4 280 V296 H407.6 V280 Q407.6 268.6 419 268.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="408" y1="296" x2="775" y2="296" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><rect x="419" y="273" width="26" height="18" rx="6" fill="color-mix(in oklab, #8b5cf6 18%, var(--background))" stroke="color-mix(in oklab, #8b5cf6 42%, var(--border))" stroke-width="1"/><text x="432" y="285.5" fill="color-mix(in oklab, #8b5cf6 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">05</text><text x="451" y="286" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Loop</text><text x="421" y="317" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">AgentRuntime</text><rect x="421" y="326" width="69" height="17" rx="5" fill="color-mix(in oklab, #8b5cf6 8%, var(--muted))" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="0.8"/><text x="427" y="338" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">run_turn</text><circle cx="425" cy="354" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="433" y="358" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Meta / avatars</text><rect x="24" y="410" width="752" height="62" rx="10" fill="color-mix(in oklab, #f59e0b 10%, var(--background))" stroke="color-mix(in oklab, #f59e0b 38%, var(--border))" stroke-width="1.1"/><circle cx="40" cy="431" r="4" fill="#f59e0b"/><text x="52" y="435" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">If every list looks empty</text><text x="52" y="454" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.8" font-weight="400" text-anchor="start">Check serve.port is still listening. A crashed import in s</text><text x="52" y="470" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.8" font-weight="400" text-anchor="start">tudio/server.py looks like data loss; it is not.</text><rect x="24" y="466" width="752" height="62" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="471" width="3" height="52" rx="1.5" fill="#6366f1"/><text x="38" y="484" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Remote agx serve is not the default product path. Clos</text><text x="38" y="500" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">ing a pane should restore the last session, not create</text><text x="38" y="516" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start"> a blank one.</text>
</svg>
