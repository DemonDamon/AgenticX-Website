<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" role="img" aria-labelledby="title desc">
  <title id="title">One YAML file, plus env overrides</title>
  <desc id="desc">config.yaml drives serve, tool rounds, providers, and skill scan paths.</desc>
