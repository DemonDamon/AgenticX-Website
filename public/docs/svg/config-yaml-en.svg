t-anchor="start">Clearing both the key and the custom base turns the pr</text><text x="38" y="421" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">ovider off. Ollama still needs a reachable URL.</text>
