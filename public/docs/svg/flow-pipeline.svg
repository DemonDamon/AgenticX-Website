<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">@start → @listen → @router</title>
  <desc id="desc">@start 抓取、@listen 分析，再由 @router 分支到 publish 或 review。</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="340" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="340" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="97" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="start">Flow 流水线</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">@start → @listen → @router</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">进程内装饰器图，不是聊天窗格。</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="118" width="168" height="112" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 118.6 H180 Q191.4 118.6 191.4 130 V146 H24.6 V130 Q24.6 118.6 36 118.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="146" x2="191" y2="146" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="123" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="135.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="136" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">@start</text><text x="38" y="167" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">fetch</text><circle cx="42" cy="184" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="188" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">拉取原始数据</text><path d="M192.00 174.00 L211.00 174.00" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><circle cx="192.0" cy="174.0" r="3" fill="var(--background)" stroke="#6366f1" stroke-width="1.6"/><path d="M209.50 177.50 L216.00 174.00 L209.50 170.50 Z" fill="#6366f1"/><g filter="url(#card-shadow)"><rect x="216" y="118" width="168" height="112" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M228 118.6 H372 Q383.4 118.6 383.4 130 V146 H216.6 V130 Q216.6 118.6 228 118.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="217" y1="146" x2="383" y2="146" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="228" y="123" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="241" y="135.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="260" y="136" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">@listen</text><text x="230" y="167" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">analyze</text><circle cx="234" cy="184" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="242" y="188" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">加工处理载荷</text><path d="M384.00 174.00 L403.00 174.00" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><circle cx="384.0" cy="174.0" r="3" fill="var(--background)" stroke="#0ea5e9" stroke-width="1.6"/><path d="M401.50 177.50 L408.00 174.00 L401.50 170.50 Z" fill="#0ea5e9"/><g filter="url(#card-shadow)"><rect x="408" y="118" width="168" height="112" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M420 118.6 H564 Q575.4 118.6 575.4 130 V146 H408.6 V130 Q408.6 118.6 420 118.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="409" y1="146" x2="575" y2="146" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><rect x="420" y="123" width="26" height="18" rx="6" fill="color-mix(in oklab, #f59e0b 18%, var(--background))" stroke="color-mix(in oklab, #f59e0b 42%, var(--border))" stroke-width="1"/><text x="433" y="135.5" fill="color-mix(in oklab, #f59e0b 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">03</text><text x="452" y="136" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">@router</text><text x="422" y="167" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">branch</text><circle cx="426" cy="184" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="434" y="188" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">返回路由标签</text><path d="M576.0 152.0 L588.0 152.0 Q596.0 152.0 596.0 144.0 L596.0 142.0 Q596.0 134.0 604.0 134.0 L611.5 134.0" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/><circle cx="576.0" cy="152.0" r="3" fill="var(--background)" stroke="#10b981" stroke-width="1.6"/><path d="M609.50 137.50 L616.00 134.00 L609.50 130.50 Z" fill="#10b981"/><path d="M576.0 196.0 L588.0 196.0 Q596.0 196.0 596.0 204.0 L596.0 208.0 Q596.0 216.0 604.0 216.0 L611.5 216.0" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/><circle cx="576.0" cy="196.0" r="3" fill="var(--background)" stroke="#8b5cf6" stroke-width="1.6"/><path d="M609.50 219.50 L616.00 216.00 L609.50 212.50 Z" fill="#8b5cf6"/><g filter="url(#card-shadow)"><rect x="616" y="102" width="160" height="68" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M628 102.6 H764 Q775.4 102.6 775.4 114 V130 H616.6 V114 Q616.6 102.6 628 102.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="617" y1="130" x2="775" y2="130" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><circle cx="634" cy="116" r="3.8" fill="#10b981"/><text x="644" y="120" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">@listen(&quot;NONEMPTY&quot;)</text><text x="630" y="151" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">publish</text><g filter="url(#card-shadow)"><rect x="616" y="182" width="160" height="68" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M628 182.6 H764 Q775.4 182.6 775.4 194 V210 H616.6 V194 Q616.6 182.6 628 182.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="617" y1="210" x2="775" y2="210" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><circle cx="634" cy="196" r="3.8" fill="#8b5cf6"/><text x="644" y="200" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">@listen(&quot;EMPTY&quot;)</text><text x="630" y="231" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">review</text><rect x="24" y="282" width="752" height="46" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="287" width="3" height="36" rx="1.5" fill="#6366f1"/><text x="38" y="300" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">kickoff() / kickoff_async() 在你的 Python 进程内执行，不会写入 mess</text><text x="38" y="316" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">ages.json。</text>
</svg>
