<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">两种第一次运行——不是同一套循环</title>
  <desc id="desc">SDK 路径返回 dict。Studio 路径把 SSE 推给 Near 或 HTTP 客户端。</desc>
  <rect width="800" height="430" rx="18" fill="color-mix(in oklab, var(--muted) 42%, var(--background))"/>
  <text x="28" y="32" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">快速上手</text><text x="28" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="start">两种第一次运行——不是同一套循环</text><text x="28" y="82" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">不要把 AgentExecutor 的构造参数和 AgentRuntime 混用。</text><text x="24" y="108" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">SDK 路径</text><rect x="24" y="118" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="40" y="144" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">01</text><text x="70" y="148" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Agent + Task</text><text x="40" y="174" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">agenticx.core</text><path d="M266.00 168.00 L271.00 168.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M271.00 171.40 L277.00 168.00 L271.00 164.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="279" y="118" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="295" y="144" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">02</text><text x="325" y="148" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">AgentExecutor.run</text><text x="295" y="174" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">llm_provider=</text><text x="295" y="192" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">run(agent=, task=)</text><path d="M521.00 168.00 L526.00 168.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M526.00 171.40 L532.00 168.00 L526.00 164.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="534" y="118" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="550" y="144" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">03</text><text x="580" y="148" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">dict 结果</text><text x="550" y="174" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">在你的进程里</text><text x="24" y="240" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">Studio / Near 路径</text><rect x="24" y="250" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="40" y="276" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">01</text><text x="70" y="280" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">agx serve</text><text x="40" y="306" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">create_studio_app</text><path d="M266.00 300.00 L271.00 300.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M271.00 303.40 L277.00 300.00 L271.00 296.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="279" y="250" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="295" y="276" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">02</text><text x="325" y="280" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Near 或 HTTP</text><text x="295" y="306" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">REST + SSE</text><path d="M521.00 300.00 L526.00 300.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M526.00 303.40 L532.00 300.00 L526.00 296.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="534" y="250" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="550" y="276" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">03</text><text x="580" y="280" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">AgentRuntime.run_turn</text><text x="550" y="306" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">messages.json</text><text x="24" y="414" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">agx studio 是终端 REPL，不是 Near 连接的 FastAPI 进程。</text>
</svg>
