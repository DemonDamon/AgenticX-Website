<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">两种第一次运行——不是同一套循环</title>
  <desc id="desc">SDK 路径返回 dict。Studio 路径把 SSE 推给 Near 或 HTTP 客户端。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.6 L10 5 L0 8.4 z" fill="var(--muted-foreground)"/>
    </marker>
  </defs>
  <rect width="800" height="430" rx="16" fill="color-mix(in oklab, var(--muted) 82%, var(--foreground) 18%)"/>
  <text x="28" y="32" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">快速上手</text><text x="28" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="start">两种第一次运行——不是同一套循环</text><text x="28" y="82" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">不要把 AgentExecutor 的构造参数和 AgentRuntime 混用。</text><text x="24" y="108" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">SDK 路径</text><rect x="24" y="118" width="241" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="128" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="38" y="132" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="148" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="68" y="148" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Agent + Task</text><text x="40" y="174" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">agenticx.core</text><path d="M266 168 L277 168" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="279" y="118" width="241" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="279" y="128" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="293" y="132" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="304" y="148" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="323" y="148" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">AgentExecutor.run</text><text x="295" y="174" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">llm_provider=</text><text x="295" y="192" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">run(agent=, task=)</text><path d="M521 168 L532 168" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="534" y="118" width="241" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="534" y="128" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="548" y="132" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="559" y="148" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="578" y="148" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">dict 结果</text><text x="550" y="174" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">在你的进程里</text><text x="24" y="240" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">Studio / Near 路径</text><rect x="24" y="250" width="241" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="260" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="38" y="264" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="280" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="68" y="280" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">agx serve</text><text x="40" y="306" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">create_studio_app</text><path d="M266 300 L277 300" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="279" y="250" width="241" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="279" y="260" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="293" y="264" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="304" y="280" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="323" y="280" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Near 或 HTTP</text><text x="295" y="306" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">REST + SSE</text><path d="M521 300 L532 300" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="534" y="250" width="241" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="534" y="260" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="548" y="264" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="559" y="280" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="578" y="280" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">AgentRuntime.run_turn</text><text x="550" y="306" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">messages.json</text><text x="24" y="414" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">agx studio 是终端 REPL，不是 Near 连接的 FastAPI 进程。</text>
</svg>
