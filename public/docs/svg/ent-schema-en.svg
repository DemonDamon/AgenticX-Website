<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 535" role="img" aria-labelledby="title desc">
  <title id="title">Tenant is the root of almost every table</title>
  <desc id="desc">tenants own IAM, chat, policy, runtime, audit, and channels. Departments nest. Users own sessions and messages.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="535" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="535" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="81" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="start">Database</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Tenant is the root of almost every table</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Business tables carry tenant_id. Cross-tenant reads are rejected in the API layer.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="752" height="80" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H764 Q775.4 108.6 775.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="136" x2="775" y2="136" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">tenants</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">One tenant row</text><circle cx="42" cy="174" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">RESTRICT deletes · composite unique keys include tenant_id</text><path d="M400.0 188.0 L400.0 194.5 Q400.0 200.0 394.5 200.0 L149.5 200.0 Q144.0 200.0 144.0 205.5 L144.0 207.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><circle cx="400.0" cy="188.0" r="3" fill="var(--background)" stroke="#6366f1" stroke-width="1.6"/><path d="M140.50 205.50 L144.00 212.00 L147.50 205.50 Z" fill="#6366f1"/><path d="M400.0 188.0 L400.0 199.5 Q400.0 200.0 400.0 200.0 L400.0 200.0 Q400.0 200.0 400.0 200.5 L400.0 207.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><path d="M396.50 205.50 L400.00 212.00 L403.50 205.50 Z" fill="#6366f1"/><path d="M400.0 188.0 L400.0 194.5 Q400.0 200.0 405.5 200.0 L649.5 200.0 Q655.0 200.0 655.0 205.5 L655.0 207.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><path d="M651.50 205.50 L655.00 212.00 L658.50 205.50 Z" fill="#6366f1"/><g filter="url(#card-shadow)"><rect x="24" y="212" width="241" height="116" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M36 212.6 H253 Q264.4 212.6 264.4 224 V240 H24.6 V224 Q24.6 212.6 36 212.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="25" y1="240" x2="264" y