ab, #8b5cf6 65%, var(--muted-foreground))"/><text x="305" y="282" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Owned by users</text><g filter="url(#card-shadow)"><rect x="534" y="212" width="241" height="116" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M546 212.6 H763 Q774.4 212.6 774.4 224 V240 H534.6 V224 Q534.6 212.6 546 212.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="535" y1="240" x2="774" y2="240" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="226" r="3.8" fill="#f59e0b"/><text x="562" y="230" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Policy</text><text x="548" y="261" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Packs · rules · versions</text><rect x="548" y="270" width="110" height="17" rx="5" fill="color-mix(in oklab, #f59e0b 8%, var(--muted))" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="0.8"/><text x="554" y="282" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">publish_events</text><path d="M144.00 328.00 L144.00 345.00" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><circle cx="144.0" cy="328.0" r="3" fill="var(--background)" stroke="#0ea5e9" stroke-width="1.6"/><path d="M140.50 343.50 L144.00 350.00 L147.50 343.50 Z" fill="#0ea5e9"/><path d="M400.00 328.00 L400.00 345.00" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/><circle cx="400.0" cy="328.0" r="3" fill="var(--background)" stroke="#8b5cf6" stroke-width="1.6"/><path d="M396.50 343.50 L400.00 350.00 L403.50 343.50 Z" fill="#8b5cf6"/><path d="M655.00 328.00 L655.00 345.00" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><circle cx="655.0" cy="328.0" r="3" fill="var(--background)" stroke="#f59e0b" stroke-width="1.6"/><path d="M651.50 343.50 L655.00 350.00 L658.50 343.50 Z" fill="#f59e0b"/><g filter="url(#card-shadow)"><rect x="24" y="350" width="241" height="112" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M36 350.6 H253 Q264.4 350.6 264.4 362 V378 H24.6 V362 Q24.6 350.6 36 350.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="25" y1="378" x2="264" y2="378" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="364" r="3.8" fill="#10b981"/><text x="52" y="368" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Runtime</text><text x="38" y="399" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">enterprise_runtime_*</text><circle cx="42" cy="416" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="50" y="420" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Providers · quotas · snapshots</text><g filter="url(#card-shadow)"><rect x="279" y="350" width="241" height="112" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f43f5e 34%, var(--border))" stroke-width="1.2"/><path d="M291 350.6 H508 Q519.4 350.6 519.4 362 V378 H279.6 V362 Q279.6 350.6 291 350.6 Z" fill="color-mix(in oklab, #f43f5e 10%, var(--background))"/><line x1="280" y1="378" x2="519" y2="378" stroke="color-mix(in oklab, #f43f5e 22%, var(--border))" stroke-width="1"/></g><circle cx="297" cy="364" r="3.8" fill="#f43f5e"/><text x="307" y="368" fill="color-mix(in oklab, #f43f5e 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Audit</text><text x="293" y="399" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Two tables</text><rect x="293" y="408" width="213" height="17" rx="5" fill="color-mix(in oklab, #f43f5e 8%, var(--muted))" stroke="color-mix(in oklab, #f43f5e 22%, var(--border))" stroke-width="0.8"/><text x="299" y="420" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">gateway_audit_events · audit_events</text><g filter="url(#card-shadow)"><rect x="534" y="350" width="241" height="112" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M546 350.6 H763 Q774.4 350.6 774.4 362 V378 H534.6 V362 Q534.6 350.6 546 350.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="535" y1="378" x2="774" y2="378" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="364" r="3.8" fill="#0ea5e9"/><text x="562" y="368" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Relay</text><text x="548" y="399" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">gateway_channels</text><circle cx="552" cy="416" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="560" y="420" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">AES-GCM api_key_cipher</text><rect x="24" y="461" width="752" height="62" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="466" width="3" height="52" rx="1.5" fill="#6366f1"/><text x="38" y="479" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Primary keys are ULID varchar(26). Encrypt provider/ch</text><text x="38" y="495" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">annel/SSO secrets with the documented env keys. This d</text><text x="38" y="511" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">iagram is a map, not a substitute for schema.md.</text>
