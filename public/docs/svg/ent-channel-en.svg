<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Channel relay when the registry is on</title>
  <desc id="desc">Admin writes channels. Gateway polls /api/internal/channels, picks by weight/priority, then relay.Executor retries.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="450" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="76" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="start">Gateway</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Channel relay when the registry is on</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Enable with GATEWAY_CHANNEL_REGISTRY=on. Admin CRUD lives in gateway_channels.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H253 Q264.4 108.6 264.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="136" x2="264" y2="136" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 01</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Admin CRUD</text><rect x="38" y="166" width="123" height="17" rx="5" fill="color-mix(in oklab, #6366f1 8%, var(--muted))" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="0.8"/><text x="44" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">gateway_channels</text><path d="M267.00 163.00 L272.00 163.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="267.0" cy="163.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M270.50 166.50 L277.00 163.00 L270.50 159.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="279" y="108" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M291 108.6 H508 Q519.4 108.6 519.4 120 V136 H279.6 V120 Q279.6 108.6 291 108.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="280" y1="136" x2="519" y2="136" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="291" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="304" y="125.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="323" y="126" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 02</text><text x="293" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Internal poll ~5s</text><circle cx="297" cy="174" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="305" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">/api/internal/channels</text><path d="M522.00 163.00 L527.00 163.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="522.0" cy="163.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M525.50 166.50 L532.00 163.00 L525.50 159.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="534" y="108" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M546 108.6 H763 Q774.4 108.6 774.4 120 V136 H534.6 V120 Q534.6 108.6 546 108.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="535" y1="136" x2="774" y2="136" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><rect x="546" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #8b5cf6 18%, var(--background))" stroke="color-mix(in oklab, #8b5cf6 42%, var(--border))" stroke-width="1"/><text x="559" y="125.5" fill="color-mix(in oklab, #8b5cf6 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">03</text><text x="578" y="126" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 03</text><text x="548" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">channel.Registry</text><circle cx="552" cy="174" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="560" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Refresh in process</text><path d="M655.0 218.0 L655.0 224.5 Q655.0 230.0 649.5 230.0 L217.5 230.0 Q212.0 230.0 212.0 235.5 L212.0 237.5" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/><circle cx="655.0" cy="218.0" r="3" fill="var(--background)" stroke="#8b5cf6" stroke-width="1.6"/><path d="M208.50 235.50 L212.00 242.00 L215.50 235.50 Z" fill="#8b5cf6"/><g filter="url(#card-shadow)"><rect x="24" y="242" width="369" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M36 242.6 H381 Q392.4 242.6 392.4 254 V270 H24.6 V254 Q24.6 242.6 36 242.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="25" y1="270" x2="392" y2="270" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="247" width="26" height="18" rx="6" fill="color-mix(in oklab, #f59e0b 18%, var(--background))" stroke="color-mix(in oklab, #f59e0b 42%, var(--border))" stroke-width="1"/><text x="49" y="259.5" fill="color-mix(in oklab, #f59e0b 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">04</text><text x="68" y="260" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 04</text><text x="38" y="291" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Picker</text><circle cx="42" cy="308" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="50" y="312" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Weight · priority · affinity</text><path d="M395.00 301.00 L400.00 301.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="395.0" cy="301.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M398.50 304.50 L405.00 301.00 L398.50 297.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="407" y="242" width="369" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M419 242.6 H764 Q775.4 242.6 775.4 254 V270 H407.6 V254 Q407.6 242.6 419 242.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="408" y1="270" x2="775" y2="270" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><rect x="419" y="247" width="26" height="18" rx="6" fill="color-mix(in oklab, #10b981 18%, var(--background))" stroke="color-mix(in oklab, #10b981 42%, var(--border))" stroke-width="1"/><text x="432" y="259.5" fill="color-mix(in oklab, #10b981 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">05</text><text x="451" y="260" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 05</text><text x="421" y="291" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">relay.Executor</text><circle cx="425" cy="308" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="433" y="312" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Adaptor → upstream</text><rect x="24" y="376" width="752" height="62" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="381" width="3" height="52" rx="1.5" fill="#6366f1"/><text x="38" y="394" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Key pool rotation happens inside the executor. A missi</text><text x="38" y="410" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">ng env ref is skipped; cooldown starts after three con</text><text x="38" y="426" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">secutive retryable failures.</text>
</svg>
