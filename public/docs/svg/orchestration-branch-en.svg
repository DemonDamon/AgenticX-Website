<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 475" role="img" aria-labelledby="title desc">
  <title id="title">Workflow nodes branch; Near groups do not use this constructor</title>
  <desc id="desc">fetch → analyze → publish or review based on confidence.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="475" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="475" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="135" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="start">In-process graph</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Workflow nodes branch; Near groups do not use this constructor</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">SDK graphs are Workflow / Node / Edge. Group chat is group_router + delegate_to_avatar.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="369" height="128" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H381 Q392.4 108.6 392.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="136" x2="392" y2="136" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Node</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">fetch</text><circle cx="42" cy="174" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Collect facts</text><circle cx="42" cy="194" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Return payload</text><path d="M395.00 172.00 L400.00 172.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="395.0" cy="172.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M398.50 175.50 L405.00 172.00 L398.50 168.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="407" y="108" width="369" height="128" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M419 108.6 H764 Q775.4 108.6 775.4 120 V136 H407.6 V120 Q407.6 108.6 419 108.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="408" y1="136" x2="775" y2="136" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><rect x="419" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #f59e0b 18%, var(--background))" stroke="color-mix(in oklab, #f59e0b 42%, var(--border))" stroke-width="1"/><text x="432" y="125.5" fill="color-mix(in oklab, #f59e0b 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="451" y="126" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Node</text><text x="421" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">analyze</text><circle cx="425" cy="174" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="433" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Score confidence</text><circle cx="425" cy="194" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="433" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">ConditionalEdge</text><path d="M588.0 236.0 L588.0 244.2 Q588.0 251.0 581.2 251.0 L218.8 251.0 Q212.0 251.0 212.0 257.8 L212.0 261.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><circle cx="588.0" cy="236.0" r="3" fill="var(--background)" stroke="#f59e0b" stroke-width="1.6"/><path d="M208.50 259.50 L212.00 266.00 L215.50 259.50 Z" fill="#f59e0b"/><path d="M588.0 236.0 L588.0 250.5 Q588.0 251.0 588.0 251.0 L588.0 251.0 Q588.0 251.0 588.0 251.5 L588.0 261.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><path d="M584.50 259.50 L588.00 266.00 L591.50 259.50 Z" fill="#f59e0b"/><g filter="url(#card-shadow)"><rect x="24" y="266" width="369" height="120" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M36 266.6 H381 Q392.4 266.6 392.4 278 V294 H24.6 V278 Q24.6 266.6 36 266.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="25" y1="294" x2="392" y2="294" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="271" width="26" height="18" rx="6" fill="color-mix(in oklab, #10b981 18%, var(--background))" stroke="color-mix(in oklab, #10b981 42%, var(--border))" stroke-width="1"/><text x="49" y="283.5" fill="color-mix(in oklab, #10b981 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">03</text><text x="68" y="284" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">High confidence</text><text x="38" y="315" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">publish</text><circle cx="42" cy="332" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="50" y="336" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Continue the DAG</text><g filter="url(#card-shadow)"><rect x="407" y="266" width="369" height="120" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f43f5e 34%, var(--border))" stroke-width="1.2"/><path d="M419 266.6 H764 Q775.4 266.6 775.4 278 V294 H407.6 V278 Q407.6 266.6 419 266.6 Z" fill="color-mix(in oklab, #f43f5e 10%, var(--background))"/><line x1="408" y1="294" x2="775" y2="294" stroke="color-mix(in oklab, #f43f5e 22%, var(--border))" stroke-width="1"/></g><rect x="419" y="271" width="26" height="18" rx="6" fill="color-mix(in oklab, #f43f5e 18%, var(--background))" stroke="color-mix(in oklab, #f43f5e 42%, var(--border))" stroke-width="1"/><text x="432" y="283.5" fill="color-mix(in oklab, #f43f5e 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">04</text><text x="451" y="284" fill="color-mix(in oklab, #f43f5e 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Low confidence</text><text x="421" y="315" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">review</text><circle cx="425" cy="332" r="2" fill="color-mix(in oklab, #f43f5e 65%, var(--muted-foreground))"/><text x="433" y="336" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Human or extra pass</text><rect x="276" y="240" width="68" height="22" rx="11" fill="color-mix(in oklab, #10b981 14%, var(--background))" stroke="color-mix(in oklab, #10b981 42%, var(--border))" stroke-width="1.1"/><text x="310" y="255" fill="color-mix(in oklab, #10b981 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">high</text><rect x="554" y="240" width="68" height="22" rx="11" fill="color-mix(in oklab, #f43f5e 14%, var(--background))" stroke="color-mix(in oklab, #f43f5e 42%, var(--border))" stroke-width="1.1"/><text x="588" y="255" fill="color-mix(in oklab, #f43f5e 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">low</text><rect x="24" y="417" width="752" height="46" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="422" width="3" height="36" rx="1.5" fill="#6366f1"/><text x="38" y="435" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Do not write AgentTeamManager(agents=[...]). That clas</text><text x="38" y="451" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">s needs llm_factory and a StudioSession.</text>
</svg>
