ang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">连工具与其他智能体</text><rect x="430" y="445" width="92" height="26" rx="8" fill="color-mix(in oklab, #10b981 12%, var(--background))" stroke="color-mix(in oklab, #10b981 36%, var(--border))" stroke-width="1"/><text x="476" y="462" fill="color-mix(in oklab, #10b981 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">MCP Hub</text><rect x="532" y="445" width="92" height="26" rx="8" fill="color-mix(in oklab, #10b981 12%, var(--background))" stroke="color-mix(in oklab, #10b981 36%, var(--border))" stroke-width="1"/><text x="578" y="462" fill="color-mix(in oklab, #10b981 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">A2A</text><rect x="634" y="445" width="92" height="26" rx="8" fill="color-mix(in oklab, #10b981 12%, var(--background))" stroke="color-mix(in oklab, #10b981 36%, var(--border))" stroke-width="1"/><text x="680" y="462" fill="color-mix(in oklab, #10b981 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">Hooks</text><path d="M220.00 502.00 L220.00 511.00" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/><circle cx="220.0" cy="502.0" r="3" fill="var(--background)" stroke="#10b981" stroke-width="1.6"/><path d="M216.50 509.50 L220.00 516.00 L223.50 509.50 Z" fill="#10b981"/><g filter="url(#card-shadow)"><rect x="24" y="516" width="752" height="88" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 35%, var(--border))" stroke-width="1.2"/><rect x="25" y="526" width="4" height="68" rx="2" fill="#f59e0b"/></g><rect x="42" y="534" width="26" height="18" rx="6" fill="color-mix(i