<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">隔离目录上的 project_state</title>
  <desc id="desc">隔离任务目录上的 project_state 按初始化、实现、校验、提交推进。</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="360" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="360" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="76" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="start">长周期</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">隔离目录上的 project_state</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">每个任务自己的目录。状态写在磁盘上，崩溃后仍可接着审计。</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="112" width="224" height="152" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M36 112.6 H236 Q247.4 112.6 247.4 124 V140 H24.6 V124 Q24.6 112.6 36 112.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="25" y1="140" x2="247" y2="140" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="126" r="3.8" fill="#8b5cf6"/><text x="52" y="130" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">TaskWorkspace</text><text x="38" y="161" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">feature-login/</text><rect x="38" y="170" width="103" height="17" rx="5" fill="color-mix(in oklab, #8b5cf6 8%, var(--muted))" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="0.8"/><text x="44" y="182" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">project_state</text><circle cx="42" cy="198" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="50" y="202" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">路径逃逸会被拒绝</text><circle cx="42" cy="218" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="50" y="222" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">重试不覆盖这份目录</text><path d="M248.00 188.00 L267.00 188.00" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/><circle cx="248.0" cy="188.0" r="3" fill="var(--background)" stroke="#8b5cf6" stroke-width="1.6"/><path d="M265.50 191.50 L272.00 188.00 L265.50 184.50 Z" fill="#8b5cf6"/><g filter="url(#card-shadow)"><rect x="272" y="126" width="50" height="124" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M284 126.6 H310 Q321.4 126.6 321.4 138 V154 H272.6 V138 Q272.6 126.6 284 126.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="273" y1="154" x2="321" y2="154" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="284" y="131" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="297" y="143.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="316" y="144" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Phase 1</text><text x="286" y="175" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">init</text><circle cx="290" cy="192" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="298" y="196" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">初始化</text><path d="M324.00 188.00 L325.00 188.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="324.0" cy="188.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M323.50 191.50 L330.00 188.00 L323.50 184.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="332" y="126" width="50" height="124" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M344 126.6 H370 Q381.4 126.6 381.4 138 V154 H332.6 V138 Q332.6 126.6 344 126.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="333" y1="154" x2="381" y2="154" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="344" y="131" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="357" y="143.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="376" y="144" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Phase 2</text><text x="346" y="175" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">implement</text><circle cx="350" cy="192" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="358" y="196" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">实现</text><path d="M384.00 188.00 L385.00 188.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="384.0" cy="188.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M383.50 191.50 L390.00 188.00 L383.50 184.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="392" y="126" width="50" height="124" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M404 126.6 H430 Q441.4 126.6 441.4 138 V154 H392.6 V138 Q392.6 126.6 404 126.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="393" y1="154" x2="441" y2="154" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><rect x="404" y="131" width="26" height="18" rx="6" fill="color-mix(in oklab, #f59e0b 18%, var(--background))" stroke="color-mix(in oklab, #f59e0b 42%, var(--border))" stroke-width="1"/><text x="417" y="143.5" fill="color-mix(in oklab, #f59e0b 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">03</text><text x="436" y="144" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Phase 3</text><text x="406" y="175" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">verify</text><circle cx="410" cy="192" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="418" y="196" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">校验</text><path d="M444.00 188.00 L445.00 188.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="444.0" cy="188.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M443.50 191.50 L450.00 188.00 L443.50 184.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="452" y="126" width="50" height="124" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M464 126.6 H490 Q501.4 126.6 501.4 138 V154 H452.6 V138 Q452.6 126.6 464 126.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="453" y1="154" x2="501" y2="154" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><rect x="464" y="131" width="26" height="18" rx="6" fill="color-mix(in oklab, #10b981 18%, var(--background))" stroke="color-mix(in oklab, #10b981 42%, var(--border))" stroke-width="1"/><text x="477" y="143.5" fill="color-mix(in oklab, #10b981 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">04</text><text x="496" y="144" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Phase 4</text><text x="466" y="175" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">commit</text><circle cx="470" cy="192" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="478" y="196" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">提交</text><rect x="24" y="318" width="752" height="30" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="323" width="3" height="20" rx="1.5" fill="#6366f1"/><text x="38" y="336" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">进程崩溃或重启后，同一功能目录与 project_state 仍留在磁盘上，可直接审计或续跑。</text>
</svg>
