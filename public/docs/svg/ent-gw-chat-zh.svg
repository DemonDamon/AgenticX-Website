und)" stroke="none" stroke-width="1.4"/><text x="49" y="236" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="68" y="236" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">quota.Check</text><text x="40" y="262" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Tracker + limiter</text><rect x="24" y="304" width="368" height="88" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="314" width="3" height="68" rx="1.5" fill="var(--foreground)"/><rect x="38" y="318" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="334" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="68" y="334" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">EvaluateRequest</text><text x="40" y="360" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">block 直接返回错误</text><rect x="24" y="402" width="368" height="88" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="412" width="3" height="68" rx="1.5" fill="var(--foreground)"/><rect x="38" y="416" width="22" heigh