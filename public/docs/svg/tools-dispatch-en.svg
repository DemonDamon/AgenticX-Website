<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 485" role="img" aria-labelledby="title desc">
  <title id="title">One dispatcher, three places a call can land</title>
  <desc id="desc">LLM tool_calls go through dispatch_tool_async to STUDIO_TOOLS, MCP, or skill_use.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="485" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="485" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="115" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="start">Tool contract</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">One dispatcher, three places a call can land</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A @tool in your script is not automatically visible in Near.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="236" y="106" width="328" height="86" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M248 106.6 H552 Q563.4 106.6 563.4 118 V134 H236.6 V118 Q236.6 106.6 248 106.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="237" y1="134" x2="563" y2="134" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><rect x="248" y="111" width="26" height="18" rx="6" fill="color-mix(in oklab, #8b5cf6 18%, var(--background))" stroke="color-mix(in oklab, #8b5cf6 42%, var(--border))" stroke-width="1"/><text x="261" y="123.5" fill="color-mix(in oklab, #8b5cf6 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="280" y="124" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Model</text><text x="250" y="155" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">LLM tool_calls</text><circle cx="254" cy="172" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="262" y="176" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Name + arguments</text><path d="M400.00 192.00 L400.00 207.00" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/><circle cx="400.0" cy="192.0" r="3" fill="var(--background)" stroke="#8b5cf6" stroke-width="1.6"/><path d="M396.50 205.50 L400.00 212.00 L403.50 205.50 Z" fill="#8b5cf6"/><g filter="url(#card-shadow)"><rect x="200" y="212" width="400" height="82" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M212 212.6 H588 Q599.4 212.6 599.4 224 V240 H200.6 V224 Q200.6 212.6 212 212.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="201" y1="240" x2="599" y2="240" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="212" y="217" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="225" y="229.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="244" y="230" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Router</text><text x="214" y="261" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">dispatch_tool_async</text><circle cx="218" cy="278" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="226" y="282" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Policy · hooks · timeout</text><path d="M400.0 294.0 L400.0 301.1 Q400.0 307.0 394.1 307.0 L149.9 307.0 Q144.0 307.0 144.0 312.9 L144.0 315.5" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><circle cx="400.0" cy="294.0" r="3" fill="var(--background)" stroke="#0ea5e9" stroke-width="1.6"/><path d="M140.50 313.50 L144.00 320.00 L147.50 313.50 Z" fill="#0ea5e9"/><path d="M400.0 294.0 L400.0 306.5 Q400.0 307.0 400.0 307.0 L400.0 307.0 Q400.0 307.0 400.0 307.5 L400.0 315.5" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><path d="M396.50 313.50 L400.00 320.00 L403.50 313.50 Z" fill="#0ea5e9"/><path d="M400.0 294.0 L400.0 301.1 Q400.0 307.0 405.9 307.0 L649.1 307.0 Q655.0 307.0 655.0 312.9 L655.0 315.5" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><path d="M651.50 313.50 L655.00 320.00 L658.50 313.50 Z" fill="#0ea5e9"/><g filter="url(#card-shadow)"><rect x="24" y="320" width="241" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M36 320.6 H253 Q264.4 320.6 264.4 332 V348 H24.6 V332 Q24.6 320.6 36 320.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="25" y1="348" x2="264" y2="348" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="334" r="3.8" fill="#0ea5e9"/><text x="52" y="338" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Builtin</text><text x="38" y="369" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">STUDIO_TOOLS</text><rect x="38" y="378" width="205" height="17" rx="5" fill="color-mix(in oklab, #0ea5e9 8%, var(--muted))" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="0.8"/><text x="44" y="390" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">file_read · liteparse · bash</text><g filter="url(#card-shadow)"><rect x="279" y="320" width="241" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M291 320.6 H508 Q519.4 320.6 519.4 332 V348 H279.6 V332 Q279.6 320.6 291 320.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="280" y1="348" x2="519" y2="348" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><circle cx="297" cy="334" r="3.8" fill="#10b981"/><text x="307" y="338" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Protocol</text><text x="293" y="369" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">MCPHub / mcp_call</text><circle cx="297" cy="386" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="305" y="390" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Added ≠ call will succeed</text><g filter="url(#card-shadow)"><rect x="534" y="320" width="241" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M546 320.6 H763 Q774.4 320.6 774.4 332 V348 H534.6 V332 Q534.6 320.6 546 320.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="535" y1="348" x2="774" y2="348" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="334" r="3.8" fill="#f59e0b"/><text x="562" y="338" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Markdown</text><text x="548" y="369" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">skill_use</text><circle cx="552" cy="386" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="560" y="390" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Progressive disclosure</text><rect x="24" y="427" width="752" height="46" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="432" width="3" height="36" rx="1.5" fill="#6366f1"/><text x="38" y="445" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Results return to the model. Group chat folds progress</text><text x="38" y="461" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start"> into one card per avatar, not one bubble per tool.</text>
</svg>
