<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Decorators build a process graph, not a chat pane</title>
  <desc id="desc">@start → @listen → @router → branch A or B.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="460" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="460" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="115" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="start">agenticx.flow</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Decorators build a process graph, not a chat pane</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">kickoff() never starts Near and never writes messages.json.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="241" height="132" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H253 Q264.4 108.6 264.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="136" x2="264" y2="136" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">@start</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Entry</text><rect x="38" y="166" width="103" height="17" rx="5" fill="color-mix(in oklab, #6366f1 8%, var(--muted))" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="0.8"/><text x="44" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">@start method</text><circle cx="42" cy="194" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Create initial state</text><path d="M267.00 174.00 L272.00 174.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="267.0" cy="174.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M270.50 177.50 L277.00 174.00 L270.50 170.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="279" y="108" width="241" height="132" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M291 108.6 H508 Q519.4 108.6 519.4 120 V136 H279.6 V120 Q279.6 108.6 291 108.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="280" y1="136" x2="519" y2="136" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="291" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="304" y="125.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="323" y="126" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">@listen</text><text x="293" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Next step</text><rect x="293" y="166" width="62" height="17" rx="5" fill="color-mix(in oklab, #0ea5e9 8%, var(--muted))" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="0.8"/><text x="299" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">@listen</text><circle cx="297" cy="194" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="305" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Wait for upstream</text><path d="M522.00 174.00 L527.00 174.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="522.0" cy="174.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M525.50 177.50 L532.00 174.00 L525.50 170.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="534" y="108" width="241" height="132" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M546 108.6 H763 Q774.4 108.6 774.4 120 V136 H534.6 V120 Q534.6 108.6 546 108.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="535" y1="136" x2="774" y2="136" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><rect x="546" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #f59e0b 18%, var(--background))" stroke="color-mix(in oklab, #f59e0b 42%, var(--border))" stroke-width="1"/><text x="559" y="125.5" fill="color-mix(in oklab, #f59e0b 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">03</text><text x="578" y="126" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">@router</text><text x="548" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Branch</text><rect x="548" y="166" width="62" height="17" rx="5" fill="color-mix(in oklab, #f59e0b 8%, var(--muted))" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="0.8"/><text x="554" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">@router</text><circle cx="552" cy="194" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="560" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Return the next name</text><path d="M655.0 240.0 L655.0 247.6 Q655.0 254.0 648.6 254.0 L218.4 254.0 Q212.0 254.0 212.0 260.4 L212.0 263.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><circle cx="655.0" cy="240.0" r="3" fill="var(--background)" stroke="#f59e0b" stroke-width="1.6"/><path d="M208.50 261.50 L212.00 268.00 L215.50 261.50 Z" fill="#f59e0b"/><path d="M655.0 240.0 L655.0 247.6 Q655.0 254.0 648.6 254.0 L594.4 254.0 Q588.0 254.0 588.0 260.4 L588.0 263.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><path d="M584.50 261.50 L588.00 268.00 L591.50 261.50 Z" fill="#f59e0b"/><g filter="url(#card-shadow)"><rect x="24" y="268" width="369" height="104" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M36 268.6 H381 Q392.4 268.6 392.4 280 V296 H24.6 V280 Q24.6 268.6 36 268.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="25" y1="296" x2="392" y2="296" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="282" r="3.8" fill="#10b981"/><text x="52" y="286" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">@listen(&quot;A&quot;)</text><text x="38" y="317" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Step A</text><rect x="38" y="326" width="96" height="17" rx="5" fill="color-mix(in oklab, #10b981 8%, var(--muted))" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="0.8"/><text x="44" y="338" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">e.g. publish</text><g filter="url(#card-shadow)"><rect x="407" y="268" width="369" height="104" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M419 268.6 H764 Q775.4 268.6 775.4 280 V296 H407.6 V280 Q407.6 268.6 419 268.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="408" y1="296" x2="775" y2="296" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><circle cx="425" cy="282" r="3.8" fill="#8b5cf6"/><text x="435" y="286" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">@listen(&quot;B&quot;)</text><text x="421" y="317" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Step B</text><rect x="421" y="326" width="89" height="17" rx="5" fill="color-mix(in oklab, #8b5cf6 8%, var(--muted))" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="0.8"/><text x="427" y="338" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">e.g. review</text><rect x="24" y="402" width="752" height="46" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="407" width="3" height="36" rx="1.5" fill="#6366f1"/><text x="38" y="420" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Pause / resume lives on ExecutionPlan (to_mermaid, pau</text><text x="38" y="436" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">se, resume) — still in your process.</text>
</svg>
