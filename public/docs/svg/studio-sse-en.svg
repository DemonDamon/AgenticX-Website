<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Near talks HTTP + SSE to one local process</title>
  <desc id="desc">Renderer → Electron main → FastAPI → SessionManager / AgentRuntime → SSE back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.6 L10 5 L0 8.4 z" fill="var(--muted-foreground)"/>
    </marker>
  </defs>
  <rect width="800" height="440" rx="16" fill="color-mix(in oklab, var(--muted) 82%, var(--foreground) 18%)"/>
  <text x="28" y="32" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Studio</text><text x="28" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="start">Near talks HTTP + SSE to one local process</text><text x="28" y="82" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">agx studio (REPL) is a different command.</text><rect x="24" y="108" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="118" width="3" height="98" rx="1.5" fill="var(--foreground)"/><rect x="38" y="122" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="138" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="68" y="130" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">Renderer</text><text x="68" y="152" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Near UI</text><text x="40" y="176" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">React panes</text><path d="M266 167 L277 167" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="279" y="108" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="279" y="118" width="3" height="98" rx="1.5" fill="var(--foreground)"/><rect x="293" y="122" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="304" y="138" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="323" y="130" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">Main</text><text x="323" y="152" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Electron</text><text x="295" y="176" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">spawn / fetch</text><path d="M521 167 L532 167" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="534" y="108" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="534" y="118" width="3" height="98" rx="1.5" fill="var(--foreground)"/><rect x="548" y="122" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="559" y="138" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="578" y="130" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">HTTP</text><text x="578" y="152" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Studio FastAPI</text><text x="550" y="176" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">create_studio_app</text><path d="M400 226 L400 246" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="246" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="256" width="3" height="90" rx="1.5" fill="var(--foreground)"/><rect x="38" y="260" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="276" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">4</text><text x="68" y="276" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">SessionManager</text><text x="40" y="302" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">messages.json</text><path d="M266 301 L277 301" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="279" y="246" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="279" y="256" width="3" height="90" rx="1.5" fill="var(--foreground)"/><rect x="293" y="260" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="304" y="276" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">5</text><text x="323" y="276" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">AgentRuntime</text><text x="295" y="302" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">run_turn</text><path d="M521 301 L532 301" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="534" y="246" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="534" y="256" width="3" height="90" rx="1.5" fill="var(--foreground)"/><rect x="548" y="260" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="559" y="276" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">6</text><text x="578" y="276" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">SSE events</text><text x="550" y="302" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Back to the pane</text><text x="24" y="408" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Leaving a pane may abort the browser fetch while the</text><text x="24" y="424" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start"> turn still finishes on disk.</text>
</svg>
