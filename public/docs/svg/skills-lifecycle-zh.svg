<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" aria-labelledby="title desc">
  <title id="title">先门禁再进会话；过了质量门才允许学成新技能</title>
  <desc id="desc">扫描根目录、门禁、暴露、使用；观察经复盘后才可能变成新的 SKILL.md。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.6 L10 5 L0 8.4 z" fill="var(--muted-foreground)"/>
    </marker>
  </defs>
  <rect width="800" height="590" rx="16" fill="color-mix(in oklab, var(--muted) 82%, var(--foreground) 18%)"/>
  <text x="28" y="32" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">技能与自进化</text><text x="28" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="start">先门禁再进会话；过了质量门才允许学成新技能</text><text x="28" y="82" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">全局关闭写在 skills.disabled。分身只把显式关闭项写入 skills_enabled。</text><text x="24" y="108" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">这一轮会话</text><rect x="24" y="118" width="369" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="128" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="38" y="132" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="148" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="68" y="148" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">扫描根目录</text><text x="40" y="174" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">~/.agenticx/skills</text><text x="40" y="192" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">预设 + 自定义路径</text><path d="M394 168 L405 168" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="407" y="118" width="369" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="407" y="128" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="421" y="132" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="432" y="148" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="451" y="148" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">scan_skill</text><text x="423" y="174" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">should_allow</text><text x="423" y="192" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">失败要写出原因</text><path d="M216 218 L216 232" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="232" width="369" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="242" width="3" height="72" rx="1.5" fill="var(--foreground)"/><rect x="38" y="246" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="262" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="68" y="262" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">可见集</text><text x="40" y="288" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">单技能开关</text><text x="40" y="306" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">来源徽章</text><path d="M394 278 L405 278" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="407" y="232" width="369" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="407" y="242" width="3" height="72" rx="1.5" fill="var(--foreground)"/><rect x="421" y="246" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="432" y="262" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">4</text><text x="451" y="262" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">skill_use</text><text x="423" y="288" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">渐进披露</text><text x="423" y="306" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">≠ 你列出的每个 CLI</text><rect x="24" y="338" width="368" height="52" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="348" width="3" height="32" rx="1.5" fill="var(--foreground)"/><text x="40" y="368" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">拦截</text><text x="40" y="394" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">写出命中类别，不要只说「高危」</text><text x="24" y="410" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">会话结束之后</text><rect x="24" y="420" width="177" height="108" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="430" width="3" height="88" rx="1.5" fill="var(--foreground)"/><text x="40" y="450" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">观察</text><text x="40" y="476" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">tool_call_observations.json</text><path d="M202 474 L213 474" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="215" y="420" width="177" height="108" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="215" y="430" width="3" height="88" rx="1.5" fill="var(--foreground)"/><text x="231" y="450" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">会话复盘</text><text x="231" y="476" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">on_agent_end 后台</text><path d="M393 474 L404 474" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="406" y="420" width="177" height="108" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="406" y="430" width="3" height="88" rx="1.5" fill="var(--foreground)"/><text x="422" y="450" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">质量门禁</text><text x="422" y="476" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">5 项检查 · 最低分</text><path d="M584 474 L595 474" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="597" y="420" width="177" height="108" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="597" y="430" width="3" height="88" rx="1.5" fill="var(--foreground)"/><text x="613" y="450" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">可选 SKILL.md</text><text x="613" y="476" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">失败 → 不自动创建</text><text x="24" y="558" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">AGX_LEARNING_ENABLED / learning.enabled 同时控制观察与复盘。市场</text><text x="24" y="574" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">搜索为空时必须回全量，不能继续只展示精选。</text>
</svg>
