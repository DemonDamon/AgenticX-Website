<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Same process, separate handlers</title>
  <desc id="desc">Client hits /mcp/{server}/… → Host resolves Registry, entitlement, backend, then transport.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="450" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="101" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="start">MCP hosting</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Same process, separate handlers</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Routes mount only when GATEWAY_MCP_HOSTING=on. Builtin demo needs no Postgres row.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="752" height="78" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H764 Q775.4 108.6 775.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="136" x2="775" y2="136" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">chi</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">/mcp/registry and /mcp/{server}/*</text><circle cx="42" cy="174" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">auth → mcp_tool policy → quota → audit</text><path d="M400.0 186.0 L400.0 193.1 Q400.0 199.0 394.1 199.0 L149.9 199.0 Q144.0 199.0 144.0 204.9 L144.0 207.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><circle cx="400.0" cy="186.0" r="3" fill="var(--background)" stroke="#6366f1" stroke-width="1.6"/><path d="M140.50 205.50 L144.00 212.00 L147.50 205.50 Z" fill="#6366f1"/><path d="M400.0 186.0 L400.0 198.5 Q400.0 199.0 400.0 199.0 L400.0 199.0 Q400.0 199.0 400.0 199.5 L400.0 207.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><path d="M396.50 205.50 L400.00 212.00 L403.50 205.50 Z" fill="#6366f1"/><path d="M400.0 186.0 L400.0 193.1 Q400.0 199.0 405.9 199.0 L649.1 199.0 Q655.0 199.0 655.0 204.9 L655.0 207.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><path d="M651.50 205.50 L655.00 212.00 L658.50 205.50 Z" fill="#6366f1"/><g filter="url(#card-shadow)"><rect x="24" y="212" width="241" height="144" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M36 212.6 H253 Q264.4 212.6 264.4 224 V240 H24.6 V224 Q24.6 212.6 36 212.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="25" y1="240" x2="264" y2="240" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="226" r="3.8" fill="#0ea5e9"/><text x="52" y="230" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">PG</text><text x="38" y="261" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Registry</text><rect x="38" y="270" width="171" height="17" rx="5" fill="color-mix(in oklab, #0ea5e9 8%, var(--muted))" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="0.8"/><text x="44" y="282" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">mcp_servers · mcp_tools</text><circle cx="42" cy="298" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="50" y="302" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">builtin demo</text><g filter="url(#card-shadow)"><rect x="279" y="212" width="241" height="144" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M291 212.6 H508 Q519.4 212.6 519.4 224 V240 H279.6 V224 Q279.6 212.6 291 212.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="280" y1="240" x2="519" y2="240" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><circle cx="297" cy="226" r="3.8" fill="#8b5cf6"/><text x="307" y="230" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Backend</text><text x="293" y="261" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">echo · openapi</text><circle cx="297" cy="278" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="305" y="282" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">custom-go is a stub</text><g filter="url(#card-shadow)"><rect x="534" y="212" width="241" height="144" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M546 212.6 H763 Q774.4 212.6 774.4 224 V240 H534.6 V224 Q534.6 212.6 546 212.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="535" y1="240" x2="774" y2="240" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="226" r="3.8" fill="#10b981"/><text x="562" y="230" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Transport</text><text x="548" y="261" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Streamable HTTP · SSE</text><circle cx="552" cy="278" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="560" y="282" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">messages channel for SSE</text><rect x="24" y="376" width="752" height="62" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="381" width="3" height="52" rx="1.5" fill="#6366f1"/><text x="38" y="394" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Scopes: mcp:server:{name}:read / :invoke, or mcp:*. Ra</text><text x="38" y="410" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">te limit is tool_calls_per_minute (default 60). edge-a</text><text x="38" y="426" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">gent does not host MCP.</text>
</svg>
