o Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Not AgentRuntime</text><path d="M144.00 260.00 L144.00 287.00" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><circle cx="144.0" cy="260.0" r="3" fill="var(--background)" stroke="#6366f1" stroke-width="1.6"/><path d="M140.50 285.50 L144.00 292.00 L147.50 285.50 Z" fill="#6366f1"/><path d="M400.00 260.00 L400.00 287.00" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><circle cx="400.0" cy="260.0" r="3" fill="var(--background)" stroke="#0ea5e9" stroke-width="1.6"/><path d="M396.50 285.50 L400.00 292.00 L403.50 285.50 Z" fill="#0ea5e9"/><path d="M655.00 260.00 L655.00 287.00" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/><circle cx="655.0" cy="260.0" r="3" fill="var(--background)" stroke="#8b5cf6" stroke-width="1.6"/><path d="M651.50 285.50 L655.00 292.00 L658.50 285.50 Z" fill="#8b5cf6"/><g filter="url(#card-shadow)"><rect x="24" y="292" width="241" height="148" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 292.6 H253 Q264.4 292.6 264.4 304 V320 H24.6 V304 Q24.6 292.6 36 292.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="320" x2="264" y2="320" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="306" r="3.8" fill="#6366f1"/><text x="52" y="310" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Python</text><text x="38" y="341" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Capability core</text><circle cx="42" cy="358" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="362" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Tools · MCP · Memory · Skills</text><circle cx="42" cy="378" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="382" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Hooks · KB · LLM providers</text><g filter="url(#card-shadow)"><rect x="279" y="292" width="241" height="148" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M291 292.6 H508 Q519.4 292.6 519.4 304 V320 H279.6 V304 Q279.6 292.6 291 292.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="280" y1="320" x2="519" y2="320" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><circle cx="297" cy="306" r="3.8" fill="#0ea5e9"/><text x="307" y="310" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Near path</text><text x="293" y="341" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Studio + AgentRuntime</text><rect x="293" y="350" width="144" height="17" rx="5" fill="color-mix(in oklab, #0ea5e9 8%, var(--muted))" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="0.8"/><text x="299" y="362" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">run_turn · sessions</text><