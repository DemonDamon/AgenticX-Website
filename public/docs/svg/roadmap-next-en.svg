    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="395" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="395" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="76" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="start">Roadmap</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Shipped vs still planned</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">M12, M18, and cluster runtime are not in the current Near loop.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="752" height="82" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H764 Q775.4 108.6 775.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="25" y1="136" x2="775" y2="136" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #10b981 18%, var(--background))" stroke="color-mix(in oklab, #10b981 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #10b981 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Shipped</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Shipped: M1–M11 / M13–M17 / v0.5</text><circle cx="42" cy="174" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="50" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Core · Near · Studio · brains · long-run · learning</text><path d="M400.0 190.0 L400.0 197.6 Q400.0 204.0 393.6 204.0 L150.4 204.0 Q144.0 204.0 144.0 210.4 L144.0 213.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><circle cx="400.0" cy="190.0" r="3" fill="var(--background)" stroke="#f59e0b" stroke-width="1.6"/><path d="M140.50 211.50 L144.00 218.00 L147.50 211.50 Z" fill="#f59e0b"/><path d="M400.0 190.0 L400.0 203.5 Q400.0 204.0 400.0 204.0 L400.0 204.0 Q400.0 204.0 400.0 204.5 L400.0 213.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><path d="M396.50 211.50 L400.00 218.00 L403.50 211.50 Z" fill="#f59e0b"/><path d="M400.0 190.0 L400.0 197.6 Q400.0 204.0 406.4 204.0 L648.6 204.0 Q655.0 204.0 655.0 210.4 L655.0 213.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><path d="M651.50 211.50 L655.00 218.00 L658.50 211.50 Z" fill="#f59e0b"/><g filter="url(#card-shadow)"><rect x="24" y="218" width="241" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M36 218.6 H253 Q264.4 218.6 264.4 230 V246 H24.6 V230 Q24.6 218.6 36 218.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="25" y1="246" x2="264" y2="246" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="232" r="3.8" fill="#f59e0b"/><text x="52" y="236" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Planned</text><text x="38" y="267" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">M12 evolution</text><circle cx="42" cy="284" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="50" y="288" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Control-plane work</text><g filter="url(#card-shadow)"><rect x="279" y="218" width="241" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M291 218.6 H508 Q519.4 218.6 519.4 230 V246 H279.6 V230 Q279.6 218.6 291 218.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="280" y1="246" x2="519" y2="246" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><circle cx="297" cy="232" r="3.8" fill="#8b5cf6"/><text x="307" y="236" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Planned</text><text x="293" y="267" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">M18 Studio RBAC</text><circle cx="297" cy="284" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="305" y="288" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Not Desktop ACL</text><g filter="url(#card-shadow)"><rect x="534" y="218" width="241" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M546 218.6 H763 Q774.4 218.6 774.4 230 V246 H534.6 V230 Q534.6 218.6 546 218.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="535" y1="246" x2="774" y2="246" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="232" r="3.8" fill="#0ea5e9"/><text x="562" y="236" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Planned</text><text x="548" y="267" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Cluster Runtime</text><circle cx="552" cy="284" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="560" y="288" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Planned</text><rect x="24" y="337" width="752" height="46" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="342" width="3" height="36" rx="1.5" fill="#6366f1"/><text x="38" y="355" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Do not treat a planned box as a live API. If a page sa</text><text x="38" y="371" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">ys planned, the code path is not the default product.</text>
