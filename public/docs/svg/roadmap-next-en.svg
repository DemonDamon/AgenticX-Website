<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" role="img" aria-labelledby="title desc">
  <title id="title">Shipped vs still planned</title>
  <desc id="desc">Core + Near/Studio + v0.5 are out. Evolution, Studio RBAC, and cluster are next.</desc>
  <defs>
