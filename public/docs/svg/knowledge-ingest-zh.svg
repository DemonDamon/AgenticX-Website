<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">解析、分块、向量化，再检索</title>
  <desc id="desc">解析只走 LiteParseAdapter。仓库索引是另一条检索工具。</desc>
  <rect width="800" height="450" rx="18" fill="color-mix(in oklab, var(--muted) 42%, var(--background))"/>
  <text x="28" y="32" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">知识库</text><text x="28" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="start">解析、分块、向量化，再检索</text><text x="28" y="82" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">百炼 embedding 批量必须 ≤ 10。</text><rect x="24" y="108" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="40" y="134" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">01</text><text x="70" y="138" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">文件 / 文件夹</text><text x="40" y="164" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">md / pdf / office</text><path d="M266.00 158.00 L271.00 158.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M271.00 161.40 L277.00 158.00 L271.00 154.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="279" y="108" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="295" y="134" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">02</text><text x="325" y="138" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">LiteParseAdapter</text><text x="295" y="164" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">不回退纯文本直读</text><path d="M521.00 158.00 L526.00 158.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M526.00 161.40 L532.00 158.00 L526.00 154.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="534" y="108" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="550" y="134" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">03</text><text x="580" y="138" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">分块</text><text x="550" y="164" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">然后向量化</text><path d="M400.00 208.00 L400.00 222.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M396.60 222.00 L400.00 228.00 L403.40 222.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="228" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="40" y="254" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">04</text><text x="70" y="258" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">embedding</text><text x="40" y="284" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">每批 ≤10</text><path d="M266.00 278.00 L271.00 278.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M271.00 281.40 L277.00 278.00 L271.00 274.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="279" y="228" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="295" y="254" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">05</text><text x="325" y="258" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">默认 Chroma</text><text x="295" y="284" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">可换其他库</text><path d="M521.00 278.00 L526.00 278.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M526.00 281.40 L532.00 278.00 L526.00 274.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="534" y="228" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="550" y="254" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">06</text><text x="580" y="258" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">knowledge_search</text><text x="550" y="284" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Studio 工具</text><rect x="24" y="344" width="752" height="56" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="40" y="374" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">仓库索引  ·  code_search 是另一条路</text><text x="24" y="434" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">入库必须露出真实百分比或阶段。失败要带文件名和异常链，不能只丢一个 token。</text>
</svg>
