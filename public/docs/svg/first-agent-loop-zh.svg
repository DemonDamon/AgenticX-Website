<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">SDK 研究环：任务进，报告出</title>
  <desc id="desc">主题变成 Task；tool_calls 回环直到模型吐出文本。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.6 L10 5 L0 8.4 z" fill="var(--muted-foreground)"/>
    </marker>
  </defs>
  <rect width="800" height="430" rx="16" fill="color-mix(in oklab, var(--muted) 82%, var(--foreground) 18%)"/>
  <text x="28" y="32" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">第一个智能体</text><text x="28" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="start">SDK 研究环：任务进，报告出</text><text x="28" y="82" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="start">这是 AgentExecutor，不是 Near 窗格。</text><rect x="24" y="108" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="118" width="3" height="90" rx="1.5" fill="var(--foreground)"/><rect x="38" y="122" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="138" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="68" y="138" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">主题</text><text x="40" y="164" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">你的问题</text><path d="M266 163 L277 163" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="279" y="108" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="279" y="118" width="3" height="90" rx="1.5" fill="var(--foreground)"/><rect x="293" y="122" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="304" y="138" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="323" y="138" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Task</text><text x="295" y="164" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">description</text><text x="295" y="182" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">expected_output</text><path d="M521 163 L532 163" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="534" y="108" width="241" height="110" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="534" y="118" width="3" height="90" rx="1.5" fill="var(--foreground)"/><rect x="548" y="122" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="559" y="138" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="578" y="138" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">AgentExecutor.run</text><text x="550" y="164" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">llm_provider=</text><path d="M400 218 L400 238" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="238" width="369" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="248" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="38" y="252" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="49" y="268" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">4</text><text x="68" y="268" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">LLM</text><text x="40" y="294" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">文本 → 报告</text><path d="M394 288 L405 288" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="407" y="238" width="369" height="100" rx="12" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="407" y="248" width="3" height="80" rx="1.5" fill="var(--foreground)"/><rect x="421" y="252" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="432" y="268" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">5</text><text x="451" y="268" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">搜索 / 抓取</text><text x="423" y="294" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">@tool 函数</text><rect x="355" y="216" width="90" height="24" rx="12" fill="color-mix(in oklab, var(--muted) 70%, var(--foreground) 10%)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><text x="400" y="232" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">tool_calls</text><text x="24" y="398" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Agent 上没有 max_iter 或 verbose。轮次上限用执行器的 max_iteration</text><text x="24" y="414" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">s。</text>
</svg>
