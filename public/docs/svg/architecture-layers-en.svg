<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" role="img" aria-labelledby="title desc">
  <title id="title">Five layers, UI down to platform</title>
  <desc id="desc">UI, Studio, core runtime, protocols, and platform services.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="690" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="690" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="115" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="start">Runtime stack</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Five layers, UI down to platform</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Read the Python / Near path this way. Enterprise Gateway is a different process.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="752" height="88" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1.2"/><rect x="25" y="118" width="4" height="68" rx="2" fill="#6366f1"/></g><rect x="42" y="126" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="55" y="138.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="78" y="140" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15.5" font-weight="700" text-anchor="start">User interface</text><text x="78" y="164" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">How a human starts a turn</text><rect x="430" y="139" width="92" height="26" rx="8" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 36%, var(--border))" stroke-width="1"/><text x="476" y="156" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">Near panes</text><rect x="532" y="139" width="92" height="26" rx="8" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 36%, var(--border))" stroke-width="1"/><text x="578" y="156" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">agx CLI</text><rect x="634" y="139" width="92" height="26" rx="8" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 36%, var(--border))" stroke-width="1"/><text x="680" y="156" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">Python SDK</text><path d="M220.00 196.00 L220.00 205.00" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><circle cx="220.0" cy="196.0" r="3" fill="var(--background)" stroke="#6366f1" stroke-width="1.6"/><path d="M216.50 203.50 L220.00 210.00 L223.50 203.50 Z" fill="#6366f1"/><g filter="url(#card-shadow)"><rect x="24" y="210" width="752" height="88" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 35%, var(--border))" stroke-width="1.2"/><rect x="25" y="220" width="4" height="68" rx="2" fill="#0ea5e9"/></g><rect x="42" y="228" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="55" y="240.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="78" y="242" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15.5" font-weight="700" text-anchor="start">Studio</text><text x="78" y="266" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Session, Meta, and team control plane</text><rect x="430" y="241" width="118" height="26" rx="8" fill="color-mix(in oklab, #0ea5e9 12%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 36%, var(--border))" stroke-width="1"/><text x="489" y="258" fill="color-mix(in oklab, #0ea5e9 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">SessionManager</text><rect x="558" y="241" width="92" height="26" rx="8" fill="color-mix(in oklab, #0ea5e9 12%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 36%, var(--border))" stroke-width="1"/><text x="604" y="258" fill="color-mix(in oklab, #0ea5e9 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">Meta-Agent</text><rect x="660" y="241" width="131" height="26" rx="8" fill="color-mix(in oklab, #0ea5e9 12%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 36%, var(--border))" stroke-width="1"/><text x="725.5" y="258" fill="color-mix(in oklab, #0ea5e9 82%, var(