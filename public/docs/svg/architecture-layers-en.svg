time</text><rect x="544" y="343" width="97" height="26" rx="8" fill="color-mix(in oklab, #8b5cf6 12%, var(--background))" stroke="color-mix(in oklab, #8b5cf6 36%, var(--border))" stroke-width="1"/><text x="592.5" y="360" fill="color-mix(in oklab, #8b5cf6 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">Tools / MCP</text><rect x="651" y="343" width="124" height="26" rx="8" fill="color-mix(in oklab, #8b5cf6 12%, var(--background))" stroke="color-mix(in oklab, #8b5cf6 36%, var(--border))" stroke-width="1"/><text x="713" y="360" fill="color-mix(in oklab, #8b5cf6 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">Memory / Skills</text><path d="M220.00 400.00 L220.00 409.00" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/><circle cx="220.0" cy="400.0" r="3" fill="var(--background)" stroke="#8b5cf6" stroke-width="1.6"/><path d="M216.50 407.50 L220.00 414.00 L223.50 407.50 Z" fill="#8b5cf6"/><g filter="url(#card-shadow)"><rect x="24" y="414" width="752" height="88" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 35%, var(--border))" stroke-width="1.2"/><rect x="25" y="424" width="4" height="68" rx="2" fill="#10b981"/></g><rect x="42" y="432" width="26" height="18" rx="6" fill="color-mix(in oklab, #10b981 18%, var(--background))" stroke="color-mix(in oklab, #10b981 42%, var(--border))" stroke-width="1"/><text x="55" y="444.5" fill="color-mix(in oklab, #10b981 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">04</text><text x="78" y="446" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15.5" font-weight="700" text-anchor="start">Protocols</text><text x="78" y="470" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Talk to tools and other agents</text><rect x="430" y="445" width="92" height="26" rx="8" fill="color-mix(in oklab, #10b981 12%, var(--background))" stroke="color-mix(in oklab, #10b981 36%, var(--border))" stroke-width="1"/><text x="476" y="462" fill="color-mix(in oklab, #10b981 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">MCP Hub</text><rect x="532" y="445" width="92" height="26" rx="8" fill="color-mix(in oklab, #10b981 12%, var(--background))" stroke="color-mix(in oklab, #10b981 36%, var(--border))" stroke-width="1"/><text x="578" y="462" fill="color-mix(in oklab, #10b981 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">A2A</text><rect x="634" y="445" width="92" height="26" rx="8" fill="color-mix(in oklab, #10b981 12%, var(--background))" stroke="color-mix(in oklab, #10b981 36%, var(--border))" stroke-width="1"/><text x="680" y="462" fill="color-mix(in oklab, #10b981 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">Hooks</text><path d="M220.00 502.00 L220.00 511.00" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/><circle cx="220.0" cy="502.0" r="3" fill="var(--background)" stroke="#10b981" stroke-width="1.6"/><path d="M216.50 509.50 L220.00 516.00 L223.50 509.50 Z" fill="#10b981"/><g filter="url(#card-shadow)"><rect x="24" y="516" width="752" height="88" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 35%, var(--border))" stroke-width="1.2"/><rect x="25" y="526" width="4" height="68" rx="2" fill="#f59e0b"/></g><rect x="42" y="534" width="26" height="18" rx="6" fill="color-mix(in oklab, #f59e0b 18%, var(--background))" stroke="color-mix(in oklab, #f59e0b 42%, var(--border))" stroke-width="1"/><text x="55" y="546.5" fill="color-mix(in oklab, #f59e0b 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">05</text><text x="78" y="548" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15.5" font-weight="700" text-anchor="start">Platform</text><text x="78" y="572" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">What lands on disk under ~/.agenticx</text><rect x="430" y="547" width="97" height="26" rx="8" fill="color-mix(in oklab, #f59e0b 12%, var(--background))" stroke="color-mix(in oklab, #f59e0b 36%, var(--border))" stroke-width="1"/><text x="478.5" y="564" fill="color-mix(in oklab, #f59e0b 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">config.yaml</text><rect x="537" y="547" width="92" height="26" rx="8" fill="color-mix(in oklab, #f59e0b 12%, var(--background))" stroke="color-mix(in oklab, #f59e0b 36%, var(--border))" stroke-width="1"/><text x="583" y="564" fill="color-mix(in oklab, #f59e0b 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">sessions</text><rect x="639" y="547" width="131" height="26" rx="8" fill="color-mix(in oklab, #f59e0b 12%, var(--background))" stroke="color-mix(in oklab, #f59e0b 36%, var(--border))" stroke-width="1"/><text x="704.5" y="564" fill="color-mix(in oklab, #f59e0b 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">Knowledge brains</text><rect x="24" y="632" width="752" height="46" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="637" width="3" height="36" rx="1.5" fill="#6366f1"/><text x="38" y="650" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Layer 2–3 are AgentRuntime. The Gateway does policy an</text><text x="38" y="666" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">d relay; it does not run this loop.</text>
