ght="600" text-anchor="middle">3</text><text x="74" y="342" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">Core</text><text x="74" y="360" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Think-act loop and shared capabilities</text><rect x="74" y="370" width="108.80000000000001" height="24" rx="12" fill="color-mix(in oklab, var(--muted) 70%, var(--foreground) 10%)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><text x="128.4" y="386" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">AgentRuntime</text><rect x="192.8" y="370" width="101.4" height="24" rx="12" fill="color-mix(in oklab, var(--muted) 70%, var(--foreground) 10%)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><text x="243.5" y="386" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Tools / MCP</text><rect x="304.20000000000005" y="370" width="131" height="24" rx="12" fill="color-mix(in oklab, var(--muted) 70%, var(--foreground) 10%)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><text x="369.70000000000005" y="386" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Memory / Skills</text><rect x="24" y="414" width="752" height="90" rx="14" fill="var(--background)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><rect x="24" y="424" width="3" height="70" rx="1.5" fill="var(--foreground)"/><rect x="40" y="426" width="22" height="22" rx="7" fill="var(--foreground)" stroke="none" stroke-width="1.4"/><text x="51" y="442" fill="var(--background)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">4</text><text x="74" y="444" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">Protocols</text><text x="74" y="462" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Talk to tools and other agents</text><rect x="74" y="472" width="96" height="24" rx="12" fill="color-mix(in oklab, var(--muted) 70%, var(--foreground) 10%)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><text x="122" y="488" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">MCP Hub</text><rect x="180" y="472" width="96" height="24" rx="12" fill="color-mix(in oklab, var(--muted) 70%, var(--foreground) 10%)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><text x="228" y="488" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">A2A</text><rect x="286" y="472" width="96" height="24" rx="12" fill="color-mix(in oklab, var(--muted) 70%, var(--foreground) 10%)" stroke="color-mix(in oklab, var(--border) 35%, var(--foreground) 28%)" stroke-width="1.4"/><text x="334" y="488" fill="var(--foreground)