<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 475" role="img" aria-labelledby="title desc">
  <title id="title">Workspace notes and the live transcript are different files</title>
  <desc id="desc">MEMORY.md is recalled into the Meta system prompt; messages.json may be compacted.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="475" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="475" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="76" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="start">Memory</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Workspace notes and the live transcript are different files</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Do not mix ~/.agenticx/workspace with an empty session_store.db.</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="369" height="132" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H381 Q392.4 108.6 392.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="25" y1="136" x2="392" y2="136" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #8b5cf6 18%, var(--background))" stroke="color-mix(in oklab, #8b5cf6 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #8b5cf6 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Long-term</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">MEMORY.md</text><rect x="38" y="166" width="157" height="17" rx="5" fill="color-mix(in oklab, #8b5cf6 8%, var(--muted))" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="0.8"/><text x="44" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">~/.agenticx/workspace</text><rect x="38" y="186" width="205" height="17" rx="5" fill="color-mix(in oklab, #8b5cf6 8%, var(--muted))" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="0.8"/><text x="44" y="198" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">_build_memory_recall_context</text><g filter="url(#card-shadow)"><rect x="407" y="108" width="369" height="132" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M419 108.6 H764 Q775.4 108.6 775.4 120 V136 H407.6 V120 Q407.6 108.6 419 108.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="408" y1="136" x2="775" y2="136" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="419" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="432" y="125.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="451" y="126" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">This session</text><text x="421" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">messages.json</text><rect x="421" y="166" width="185" height="17" rx="5" fill="color-mix(in oklab, #0ea5e9 8%, var(--muted))" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="0.8"/><text x="427" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">~/.agenticx/sessions/&lt;id&gt;</text><circle cx="425" cy="194" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="433" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">maybe compact</text><path d="M212.0 240.0 L212.0 253.5 Q212.0 254.0 212.0 254.0 L212.0 254.0 Q212.0 254.0 212.0 254.5 L212.0 263.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><circle cx="212.0" cy="240.0" r="3" fill="var(--background)" stroke="#6366f1" stroke-width="1.6"/><path d="M208.50 261.50 L212.00 268.00 L215.50 261.50 Z" fill="#6366f1"/><path d="M588.0 240.0 L588.0 247.6 Q588.0 254.0 581.6 254.0 L218.4 254.0 Q212.0 254.0 212.0 260.4 L212.0 263.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><circle cx="588.0" cy="240.0" r="3" fill="var(--background)" stroke="#6366f1" stroke-width="1.6"/><path d="M208.50 261.50 L212.00 268.00 L215.50 261.50 Z" fill="#6366f1"/><g filter="url(#card-shadow)"><rect x="24" y="268" width="369" height="132" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 268.6 H381 Q392.4 268.6 392.4 280 V296 H24.6 V280 Q24.6 268.6 36 268.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="296" x2="392" y2="296" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="273" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="285.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">03</text><text x="68" y="286" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Meta</text><text x="38" y="317" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Assemble prompt</text><rect x="38" y="326" width="185" height="17" rx="5" fill="color-mix(in oklab, #6366f1 8%, var(--muted))" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="0.8"/><text x="44" y="338" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">_build_user_profile_block</text><circle cx="42" cy="354" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="358" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">active subagents snapshot</text><path d="M395.00 334.00 L400.00 334.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="395.0" cy="334.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M398.50 337.50 L405.00 334.00 L398.50 330.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="407" y="268" width="369" height="132" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M419 268.6 H764 Q775.4 268.6 775.4 280 V296 H407.6 V280 Q407.6 268.6 419 268.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="408" y1="296" x2="775" y2="296" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><rect x="419" y="273" width="26" height="18" rx="6" fill="color-mix(in oklab, #10b981 18%, var(--background))" stroke="color-mix(in oklab, #10b981 42%, var(--border))" stroke-width="1"/><text x="432" y="285.5" fill="color-mix(in oklab, #10b981 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">04</text><text x="451" y="286" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">This turn</text><text x="421" y="317" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">System prompt</text><circle cx="425" cy="334" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="433" y="338" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Preferences stay</text><circle cx="425" cy="354" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="433" y="358" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Titles live in SQLite</text><rect x="24" y="401" width="752" height="62" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="406" width="3" height="52" rx="1.5" fill="#6366f1"/><text x="38" y="419" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Session titles / FTS: ~/.agenticx/memory/sessions.sqli</text><text x="38" y="435" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">te. The next turn should already know a preference you</text><text x="38" y="451" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start"> wrote down.</text>
</svg>
