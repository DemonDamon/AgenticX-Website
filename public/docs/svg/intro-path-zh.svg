<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">一轮请求怎么走</title>
  <desc id="desc">先选 Near 或 SDK，再由 Studio 调用 AgentRuntime，去打工具、模型和记忆。</desc>
