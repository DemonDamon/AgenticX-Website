PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">admin-console</text><rect x="293" y="280" width="62" height="17" rx="5" fill="color-mix(in oklab, #8b5cf6 8%, var(--muted))" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="0.8"/><text x="299" y="292" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">Next.js</text><circle cx="297" cy="308" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="305" y="312" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Writes PG + snapshots</text><g filter="url(#card-shadow)"><rect x="534" y="222" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M546 222.6 H763 Q774.4 222.6 774.4 234 V250 H534.6 V234 Q534.6 222.6 546 222.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="535" y1="250" x2="774" y2="250" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="236" r="3.8" fill="#f59e0b"/><text x="562" y="240" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">:8088</text><text x="548" y="271" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">apps/gateway</text><circle cx="552" cy="288" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="560" y="292" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Go + chi</text><circle cx="552" cy="308" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="560" y="312" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Policy · quota · audit</text><path d="M144.00 340.00 L144.00 359.00" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><circle cx="144.0" cy="340.0" r="3" fill="var(--background)" stroke="#0ea5e9" stroke-width="1.6"/><path d="M140.50 357.50 L144.00 364.00 L147.50 357.50 Z" fill="#0ea5e9"/><path d="M400.00 340.00 L400.00 359.00" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><circle cx="400.0" cy="340.0" r="3" fill="var(--background)" stroke="#0ea5e9" stroke-width="1.6"/><path d="M396.50 357.50 L400.00 364.00 L403.50 357.50 Z" fill="#0ea5e9"/><path d="M655.00 340.00 L655.00 359.00" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/><circle cx="655.0" cy="340.0" r="3" fill="var(--background)" stroke="#10b981" stroke-width="1.6"/><path d="M651.50 357.50 L655.00 364.00 L658.50 357.50 Z" fill="#10b981"/><g filter="url(#card-shadow)"><rect x="24" y="364" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M36 364.6 H253 Q264.4 364.6 264.4 376 V392 H24.6 V376 Q24.6 364.6 36 364.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="25" y1="392" x2="264" y2="392" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="378" r="3.8" fill="#0ea5e9"/><text x="52" y="382" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-si