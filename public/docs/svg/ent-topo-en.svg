ll="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Portal session</text><circle cx="297" cy="450" r="2" fill="color-mix(in oklab, #f43f5e 65%, var(--muted-foreground))"/><text x="305" y="454" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Optional rate limit</text><g filter="url(#card-shadow)"><rect x="534" y="364" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M546 364.6 H763 Q774.4 364.6 774.4 376 V392 H534.6 V376 Q534.6 364.6 546 364.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="535" y1="392" x2="774" y2="392" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="378" r="3.8" fill="#10b981"/><text x="562" y="382" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">HTTPS</text><text x="548" y="413" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Upstream LLM</text><circle cx="552" cy="430" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="560" y="434" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">OpenAI-compatible</text><circle cx="552" cy="450" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="560" y="454" fill="var(--muted-foreground)" font-family="'PingFang SC',