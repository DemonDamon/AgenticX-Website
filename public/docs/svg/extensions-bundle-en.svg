<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" role="img" aria-labelledby="title desc">
  <title id="title">Scan and guard before a skill is visible</title>
  <desc id="desc">skill_use is path 1. active_skill in the system prompt is path 2.</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="455" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="455" rx="16" fill="url(#dot-grid)"/>
