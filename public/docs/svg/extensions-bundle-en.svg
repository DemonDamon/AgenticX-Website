="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 01</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Scan roots</text><rect x="38" y="166" width="178" height="17" rx="5" fill="color-mix(in oklab, #6366f1 8%, var(--muted))" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="0.8"/><text x="44" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">build_skill_search_paths</text><path d="M267.00 162.00 L272.00 162.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="267.0" cy="162.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M270.50 165.50 L277.00 162.00 L270.50 158.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="279" y="108" width="241" height="108" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f43f5e 34%, var(--border))" stroke-width="1.2"/><path d="M291 108.6 H508 Q519.4 108.6 519.4 120 V136 H279.6 V120 Q279.6 108.6 291 108.6 Z" fill="color-mix(in oklab, #f43f5e 10%, var(--background))"/><line x1="280" y1="136" x2="519" y2="136" stroke="color-mix(in oklab, #f43f5e 22%, var(--border))" stroke-width="1"/></g><rect x="291" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #f43f5e 18%, var(--background))" stroke="color-mix(in oklab, #f43f5e 42%, var(--border))" stroke-width="1"/><text x="304" y="125.5" fill="color-mix(in oklab, #f43f5e 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="323" y="126" fill="color-mix(in oklab, #f43f5e 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 02</text><text x="293" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">scan_skill</text><rect x="293" y="166" width="96" height="17" rx="5" fill="color-mix(in oklab, #f43f5e 8%, var(--muted))" stroke="color-mix(in oklab, #f43f5e 22%, var(--border))" stroke-width="0.8"/><text x="299" y="178" fill="var(--foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.2" font-weight="500" text-anchor="start">should_allow</text><path d="M522.00 162.00 L527.00 162.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="522.0" cy="162.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M525.50 165.50 L532.00 162.00 L525.50 158.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="534" y="108" width="241" height="108" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M546 108.6 H763 Q774.4 108.6 774.4 120 V136 H534.6 V120 Q534.6 108.6 546 108.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="535" y1="136" x2="774" y2="136" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="546" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="559" y="125.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">03</text><text x="578" y="126" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 03</text><text x="548" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Skill list</text><circle cx="552" cy="174" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="560" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Per-skill toggles</text><path d="M655.0 216.0 L655.0 223.1 Q655.0 229.0 649.1 229.0 L149.9 229.0 Q144.0 229.0 144.0 234.9 L144.0 237.5" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><circle cx="655.0" cy="216.0" r="3" fill="var(--background)" stroke="#0ea5e9" stroke-width="1.6"/><path d="M140.50 235.50 L144.00 242.00 L147.50 235.50 Z" fill="#0ea5e9"/><path d="M655.0 216.0 L655.0 223.1 Q655.0 229.0 649.1 229.0 L405.9 229.0 Q400.0 229.0 400.0 234.9 L400.0 237.5" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><path d="M396.50 235.50 L400.00 242.00 L403.50 235.50 Z" fill="#0ea5e9"/><path d="M655.0 216.0 L655.0 228.5 Q655.0 229.0 655.0 229.0 L655.0 229.0 Q655.0 229.0 655.0 229.5 L655.0 237.5" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/><path d="M651.50 235.50 L655.00 242.00 L658.50 235.50 Z" fill="#0ea5e9"/><g filter="url(#card-shadow)"><rect x="24" y="242" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M36 242.6 H253 Q264.4 242.6 264.4 254 V270 H24.6 V254 Q24.6 242.6 36 242.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="25" y1="270" x2="264" y2="270" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><circle cx="42" cy="256" r="3.8" fill="#10b981"/><text x="52" y="260" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Path 1</text><text x="38" y="291" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">skill_use</text><circle cx="42" cy="308" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="50" y="312" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Progressive disclose</text><g filter="url(#card-shadow)"><rect x="279" y="242" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M291 242.6 H508 Q519.4 242.6 519.4 254 V270 H279.6 V254 Q279.6 242.6 291 242.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="280" y1="270" x2="519" y2="270" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><circle cx="297" cy="256" r="3.8" fill="#8b5cf6"/><text x="307" y="260" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Path 2</text><text x="293" y="291" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">active_skill</text><circle cx="297" cy="308" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="305" y="312" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">System prompt</text><g filter="url(#card-shadow)"><rect x="534" y="242" width="241" height="118" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #f59e0b 34%, var(--border))" stroke-width="1.2"/><path d="M546 242.6 H763 Q774.4 242.6 774.4 254 V270 H534.6 V254 Q534.6 242.6 546 242.6 Z" fill="color-mix(in oklab, #f59e0b 10%, var(--background))"/><line x1="535" y1="270" x2="774" y2="270" stroke="color-mix(in oklab, #f59e0b 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="256" r="3.8" fill="#f59e0b"/><text x="562" y="260" fill="color-mix(in oklab, #f59e0b 78%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="start">Also</text><text x="548" y="291" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">MCPHub</text><circle cx="552" cy="308" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="560" y="312" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">marketplace / mcp.json</text><rect x="24" y="397" width="752" height="46" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="402" width="3" height="36" rx="1.5" fill="#6366f1"/><text x="38" y="415" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Empty marketplace search must return the full catalog,</text><text x="38" y="431" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start"> not a curated slice.</text>
</svg>
