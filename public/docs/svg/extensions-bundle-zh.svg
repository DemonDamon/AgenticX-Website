<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">先扫描和门禁，技能才进入可见集</title>
  <desc id="desc">skill_use 是路径 1。系统提示里的 active_skill 是路径 2。</desc>
