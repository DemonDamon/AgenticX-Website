t-size="15" font-weight="650" text-anchor="start">Callback + code</text><circle cx="428" cy="174" r="2" fill="color-mix(in oklab, #f59e0b 65%, var(--muted-foreground))"/><text x="436" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">/oidc/callback</text><g filter="url(#card-shadow)"><rect x="410" y="212" width="366" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M422 212.6 H764 Q775.4 212.6 775.4 224 V240 H410.6 V224 Q410.6 212.6 422 212.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="411" y1="240" x2="775" y2="240" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="422" y="217" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="435" y="229.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">05</text><text x="454" y="230" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 05</text><text x="424" y="261" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Token exchange</text><circle cx="428" cy="278" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="436" y="282" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Then JIT upsert</text><path d="M593.00 201.00 L593.00 206.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="593.0" cy="201.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M589.50 204.50 L593.00 211.00 L596.50 204.50 Z" fill="var(--muted-foreground)"/><g filter="url(#card-shadow)"><rect x="410" y="316" width="366" height="92" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #10b981 34%, var(--border))" stroke-width="1.2"/><path d="M422 316.6 H764 Q775.4 316.6 775.4 328 V344 H410.6 V328 Q410.6 316.6 422 316.6 Z" fill="color-mix(in oklab, #10b981 10%, var(--background))"/><line x1="411" y1="344" x2="775" y2="344" stroke="color-mix(in oklab, #10b981 22%, var(--border))" stroke-width="1"/></g><rect x="422" y="321" width="26" height="18" rx="6" fill="color-mix(in oklab, #10b981 18%, var(--background))" stroke="color-mix(in oklab, #10b981 42%, var(--border))" stroke-width="1"/><text x="435" y="333.5" fill="color-mix(in oklab, #10b981 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">06</text><text x="454" y="334" fill="color-mix(in oklab, #10b981 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">STEP 06</text><text x="424" y="365" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Set-Cookie</text><circle cx="428" cy="382" r="2" fill="color-mix(in oklab, #10b981 65%, var(--muted-foreground))"/><text x="436" y="386" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Redirect /workspace</text><path d="M593.00 305.00 L593.00 310.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round"/><circle cx="593.0" cy="305.0" r="3" fill="var(--background)" stroke="var(--muted-foreground)" stroke-width="1.6"/><path d="M589.50 308.50 L593.00 315.00 L596.50 308.50 Z" fill="var(--muted-foreground)"/><path d="M390.0 362.0 L395.5 362.0 Q400.0 362.0 400.0 357.5 L400.0 158.5 Q400.0 154.0 404.5 154.0 L405.5 154.0" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="390.0" cy="362.0" r="3" fill="var(--background)" stroke="#6366f1" stroke-width="1.6"/><path d="M403.50 157.50 L410.00 154.00 L403.50 150.50 Z" fill="#6366f1"/><rect x="24" y="411" width="752" height="62" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="416" width="3" height="52" rx="1.5" fill="#6366f1"/><text x="38" y="429" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Missing NEXT_PUBLIC_SSO_PROVIDERS or issuer env fails </text><text x="38" y="445" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">discovery. Restart Next after changing SSO env; hot re</text><text x="38" y="461" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">load will not pick it up.</text>
