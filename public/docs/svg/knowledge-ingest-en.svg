order)" stroke-width="1"/><text x="40" y="254" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">04</text><text x="70" y="258" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">embedding</text><text x="40" y="284" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Batches of ≤10</text><path d="M266.00 278.00 L271.00 278.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M271.00 281.40 L277.00 278.00 L271.00 274.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="279" y="228" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="295" y="254" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">05</text><text x="325" y="258" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Chroma default</text><text x="295" y="284" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Optional other stores</text><path d="M521.00 278.00 L526.00 278.00" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round"/><path d="M526.00 281.40 L532.00 278.00 L526.00 274.60" fill="none" stroke="var(--muted-foreground)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="534" y="228" width="241" height="100" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="550" y="254" fill="var(--muted-foreground)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">06</text><text x="580" y="258" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">knowledge_search</text><text x="550" y="284" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Studio tool</text><rect x="24" y="344" width="752" height="56" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="1"/><text x="40" y="374" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Repo index  ·  code_search is a separate path</text><text x="24" y="402" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Ingest must show real percent or stage text. Failure</text><text x="24" y="418" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">s need the filename and the exception chain, not a s</text><text x="24" y="434" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">ingle token.</text>
