<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-labelledby="title desc">
  <title id="title">一套能力核心，三扇门</title>
  <desc id="desc">SDK、Near 桌面与 Enterprise 走不同运行时，但都可以打到上游模型。</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="color-mix(in oklab, var(--foreground) 12%, transparent)"/>
    </pattern>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="550" rx="16" fill="color-mix(in oklab, var(--muted) 32%, var(--background))" stroke="var(--border)" stroke-width="1"/>
  <rect width="800" height="550" rx="16" fill="url(#dot-grid)"/>
  <rect x="24" y="16" width="76" height="20" rx="10" fill="color-mix(in oklab, #6366f1 12%, var(--background))" stroke="color-mix(in oklab, #6366f1 35%, var(--border))" stroke-width="1"/><circle cx="34" cy="26" r="3" fill="#6366f1"/><text x="42" y="30" fill="color-mix(in oklab, #6366f1 82%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="start">产品形态</text><text x="24" y="58" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">一套能力核心，三扇门</text><text x="24" y="79" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Near 与 Enterprise 共用抽象，当前部署路径彼此独立。</text><line x1="24" y1="92" x2="776" y2="92" stroke="var(--border)" stroke-width="1"/><g filter="url(#card-shadow)"><rect x="24" y="108" width="241" height="152" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #6366f1 34%, var(--border))" stroke-width="1.2"/><path d="M36 108.6 H253 Q264.4 108.6 264.4 120 V136 H24.6 V120 Q24.6 108.6 36 108.6 Z" fill="color-mix(in oklab, #6366f1 10%, var(--background))"/><line x1="25" y1="136" x2="264" y2="136" stroke="color-mix(in oklab, #6366f1 22%, var(--border))" stroke-width="1"/></g><rect x="36" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #6366f1 18%, var(--background))" stroke="color-mix(in oklab, #6366f1 42%, var(--border))" stroke-width="1"/><text x="49" y="125.5" fill="color-mix(in oklab, #6366f1 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">01</text><text x="68" y="126" fill="color-mix(in oklab, #6366f1 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">你的进程</text><text x="38" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">SDK / CLI</text><circle cx="42" cy="174" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">AgentExecutor(llm_provider=)</text><circle cx="42" cy="194" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">run(agent=, task=)</text><circle cx="42" cy="214" r="2" fill="color-mix(in oklab, #6366f1 65%, var(--muted-foreground))"/><text x="50" y="218" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">没有 Near 窗格</text><g filter="url(#card-shadow)"><rect x="279" y="108" width="241" height="152" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #0ea5e9 34%, var(--border))" stroke-width="1.2"/><path d="M291 108.6 H508 Q519.4 108.6 519.4 120 V136 H279.6 V120 Q279.6 108.6 291 108.6 Z" fill="color-mix(in oklab, #0ea5e9 10%, var(--background))"/><line x1="280" y1="136" x2="519" y2="136" stroke="color-mix(in oklab, #0ea5e9 22%, var(--border))" stroke-width="1"/></g><rect x="291" y="113" width="26" height="18" rx="6" fill="color-mix(in oklab, #0ea5e9 18%, var(--background))" stroke="color-mix(in oklab, #0ea5e9 42%, var(--border))" stroke-width="1"/><text x="304" y="125.5" fill="color-mix(in oklab, #0ea5e9 84%, var(--foreground))" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">02</text><text x="323" y="126" fill="color-mix(in oklab, #0ea5e9 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">本机工作区</text><text x="293" y="157" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Near 桌面</text><circle cx="297" cy="174" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="305" y="178" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">拉起 agx serve</text><circle cx="297" cy="194" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="305" y="198" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">REST + SSE</text><circle cx="297" cy="214" r="2" fill="color-mix(in oklab, #0ea5e9 65%, var(--muted-foreground))"/><text x="305" y="218" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">只连 127.0.0.1</text><g filter="url(#card-shadow)"><rect x="534" y="108" width="241" height="152" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M546 108.6 H763 Q774.4 108.6 774.4 120 V136 H534.6 V120 Q534.6 108.6 546 108.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="5