i-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">分身 · 群聊</text><g filter="url(#card-shadow)"><rect x="534" y="292" width="241" height="148" rx="12" fill="var(--background)" stroke="color-mix(in oklab, #8b5cf6 34%, var(--border))" stroke-width="1.2"/><path d="M546 292.6 H763 Q774.4 292.6 774.4 304 V320 H534.6 V304 Q534.6 292.6 546 292.6 Z" fill="color-mix(in oklab, #8b5cf6 10%, var(--background))"/><line x1="535" y1="320" x2="774" y2="320" stroke="color-mix(in oklab, #8b5cf6 22%, var(--border))" stroke-width="1"/></g><circle cx="552" cy="306" r="3.8" fill="#8b5cf6"/><text x="562" y="310" fill="color-mix(in oklab, #8b5cf6 78%, var(--foreground))" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="start">Enterprise 路径</text><text x="548" y="341" fill="var(--foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="start">Go 网关</text><circle cx="552" cy="358" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="560" y="362" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">策略 · 配额 · 审计</text><circle cx="552" cy="378" r="2" fill="color-mix(in oklab, #8b5cf6 65%, var(--muted-foreground))"/><text x="560" y="382" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">OpenAI 兼容中继</text><rect x="24" y="508" width="752" height="30" rx="8" fill="color-mix(in oklab, var(--muted) 55%, var(--background))" stroke="var(--border)" stroke-width="0.9"/><rect x="24" y="513" width="3" height="20" rx="1.5" fill="#6366f1"/><text x="38" y="526" fill="var(--muted-foreground)" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">不要指望网关后面还有 Desktop 窗格。上面的正式架构图才是产品总图。</text>
